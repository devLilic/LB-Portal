name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use stable semantic versions (for example v1.2.3); got $env:GITHUB_REF_NAME."
          }
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion (expected $expectedTag)."
          }

      - name: Build Windows release assets
        run: npm run build -- --publish never

      # Keep release creation outside electron-builder. Its GitHub publisher can
      # issue parallel create-release requests for the generated assets, which
      # can race and create duplicate releases for the same tag.
      - name: Publish Windows release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: LB-Portal ${{ github.ref_name }}
          body: LB-Portal ${{ github.ref_name }}
          files: |
            release/**/LB-Portal-*-x64.exe
            release/**/LB-Portal-*-x64.exe.blockmap
            release/**/latest.yml
          fail_on_unmatched_files: true
          overwrite_files: true
